name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skill-spec-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install skills-ref
        run: pip install skills-ref
      - name: Validate skills
        run: agentskills validate skills/iag-disclosure

  declare-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Selftest declare.py
        run: python3 skills/iag-disclosure/scripts/declare.py selftest
